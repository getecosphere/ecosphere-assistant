<style>

</style>
</helmet>
<div style="width:400px;height:900px;display:flex;flex-direction:column;background:#f7f6f2;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;color:#17141d;font-size:14px;line-height:1.5;border:1px solid #ded9e1;box-sizing:border-box">
  <div class="ph"><dc-import name="PixelE" variant="{{four}}" size="{{s20}}" dot="{{one}}" dark="{{no}}" anim="{{busy}}" hint-size="20px,20px"></dc-import><b style="font-size:14px;margin-left:4px">Ecosphere Assistant</b><span class="grow"></span><span class="mono" style="font-size:11.5px;color:#8d8493">{{stepLabel}}</span></div>
  <div class="scroll" style="gap:0;padding:0">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px 18px;text-align:center"><dc-import name="PixelE" variant="{{four}}" size="{{s64}}" dot="{{one}}" dark="{{no}}" anim="{{busy}}" hint-size="64px,64px"></dc-import><b style="font-size:20px;letter-spacing:-.03em">Agen coding di samping halamanmu</b><span style="font-size:13.5px;color:#665f6e">Kodenya tetap di mesinmu. Panel ini menyiapkan semuanya, kamu cukup menyetujui.</span></div>
    <sc-for list="{{steps}}" as="p" hint-placeholder-count="5">
      <div style="{{p.rowStyle}}">
        <span style="{{p.dot}}">{{p.mark}}</span>
        <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
          <b style="font-size:14px;color:{{p.ink}}">{{p.title}}</b>
          <span style="font-size:12.5px;color:#665f6e">{{p.desc}}</span>
          <sc-if value="{{p.cur}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
            <sc-if value="{{p.isLogin}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:8px">
              <button type="button" class="btn" onClick="{{useCli}}">Pakai akun eco CLI di Mac ini · eko@…</button>
              <button type="button" class="btn g" onClick="{{google}}">Masuk dengan Google</button>
              <sc-if value="{{showCode}}" hint-placeholder-val="{{false}}"><div class="pm"><span style="font-size:12.5px">Setujui di tab yang terbuka. Kode perangkat:</span><b class="mono" style="font-size:20px;letter-spacing:.1em">KXQ-482</b></div></sc-if>
            </div></sc-if>
            <sc-if value="{{p.isOc}}" hint-placeholder-val="{{false}}"><div style="padding:8px 10px;border-radius:8px;background:#17131f;font:11.5px/1.7 'DM Mono',monospace;color:#d9d2e8"><sc-for list="{{ocLines}}" as="l" hint-placeholder-count="3"><div>{{l}}</div></sc-for></div></sc-if>
            <sc-if value="{{p.isDir}}" hint-placeholder-val="{{false}}"><div class="card"><sc-for list="{{dirs}}" as="d" hint-placeholder-count="3"><button type="button" onClick="{{d.pick}}" style="{{d.style}}"><span style="min-width:0"><b style="display:block;font-size:13px">{{d.name}}</b><span class="mono" style="font-size:11px;color:#8d8493">{{d.path}}</span></span><span class="mono" style="font-size:11px;color:#5b3fd6">{{d.tag}}</span></button></sc-for></div></sc-if>
            <sc-if value="{{p.showNext}}" hint-placeholder-val="{{false}}"><button type="button" class="btn br" style="align-self:flex-start" onClick="{{next}}">{{p.cta}}</button></sc-if>
          </div></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
  <div class="comp" style="flex-direction:row;align-items:center"><span class="mono grow" style="font-size:11.5px;color:#8d8493">helper · opencode · eco · semua lokal</span><button type="button" class="btn g" onClick="{{reset}}">Ulangi</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 400, "height": 900}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.nid = 1;
    this.state = Object.assign({ side: 'right', menu: false, items: this.seed().map(x => Object.assign({ id: this.nid++ }, x)), q: [], busy: false, wait: null, draft: '', chips: { page: true, shot: false, el: false, con: false }, reloaded: false, qaSent: false, qaStarted: false, allowAll: false }, this.extraState());
  }
  componentDidMount() { this.iv = setInterval(() => this.tick(), 700); }
  componentWillUnmount() { clearInterval(this.iv); }
  extraState() { return {}; }
  seed() { return []; }
  onItem() {}
  tick() {
    const s = this.state;
    if (this.extraTick) this.extraTick();
    if (s.wait) return;
    if (!s.q.length) { if (s.busy) this.setState({ busy: false }); return; }
    const n = Object.assign({ id: this.nid++ }, s.q[0]);
    const rest = s.q.slice(1);
    if (n.kind === 'perm' && s.allowAll) {
      this.setState({ items: s.items.concat([Object.assign({}, n, { answered: 'auto' })]), q: rest });
      return;
    }
    if (n.kind === 'perm') { this.setState({ items: s.items.concat([n]), q: rest, wait: n.id }); return; }
    this.setState({ items: s.items.concat([n]), q: rest, busy: rest.length > 0 });
    this.onItem(n);
  }
  run(list) { this.setState({ q: this.state.q.concat(list), busy: true, reloaded: false }); }
  answer(id, a) {
    const s = this.state;
    const items = s.items.map(it => it.id === id ? Object.assign({}, it, { answered: a }) : it);
    if (a === 'deny') {
      this.setState({ items: items.concat([{ id: this.nid++, kind: 'text', text: 'Oke, tidak saya jalankan. Uji ulang manual: eco up dev, lalu buka /library.' }]), q: [], wait: null, busy: false });
    } else this.setState({ items, wait: null, busy: true, allowAll: a === 'all' ? true : s.allowAll });
  }
  qaScript() {
    return [
      { kind: 'user', text: 'Kerjakan QA #152: /library masih terbuka & komentar lolos tag script.', chips: ['qa #152', 'library.png', 'remoteworker.id/library'] },
      { kind: 'text', text: 'Saya ambil laporannya, baca screenshot, lalu reproduksi di estate lokal.' },
      { kind: 'step', tool: 'pickup', arg: 'qa #152 · tunggu 06:12', meta: 'eco pm' },
      { kind: 'step', tool: 'read', arg: 'screenshot 1/1 · /library', meta: '' },
      { kind: 'step', tool: 'repro', arg: 'GET /library → 200 (harusnya 404)', meta: ':20032' },
      { kind: 'diff', file: 'rwid-os/src/routes.rs', plus: 0, minus: 2, lines: [[' ', '.route("/apps", apps)'], ['-', '.route("/library", library)'], ['-', '.route("/library/:id", book)'], [' ', '.route("/campus", campus)']] },
      { kind: 'diff', file: 'comments/src/render.rs', plus: 2, minus: 1, lines: [['-', 'html.push_str(&c.body);'], ['+', 'html.push_str(&escape_html(&c.body));'], ['+', 'csp.script_src("self");']] },
      { kind: 'step', tool: 'test', arg: '12/12 payload ditolak', meta: 'cargo test' },
      { kind: 'perm', cmd: 'eco up dev', why: 'Restart estate lokal supaya bisa diuji ulang di tab ini.' },
      { kind: 'step', tool: 'run', arg: 'eco up dev · 6/6 online', meta: '00:41' },
      { kind: 'step', tool: 'verify', arg: 'GET /library → 404 ✓', meta: ':20032' },
      { kind: 'done', title: 'QA #152 siap diverifikasi', list: ['/library sekarang 404', 'komentar di-escape + CSP', '12/12 payload ditolak'], qa: true }
    ];
  }
  genericScript(text, chips) {
    return [
      { kind: 'user', text, chips },
      { kind: 'text', text: 'Oke. Saya lihat halaman yang terbuka dan kode yang terkait dulu.' },
      { kind: 'step', tool: 'read', arg: 'tab aktif · remoteworker.id/library', meta: '' },
      { kind: 'step', tool: 'grep', arg: '"Library" → web/src/pages/library.tsx', meta: '3 hit' },
      { kind: 'diff', file: 'web/src/pages/library.tsx', plus: 3, minus: 1, lines: [['-', '<p>Ebook dan catatan kursus.</p>'], ['+', '<p>Ebook dan catatan kursus untuk member.</p>'], ['+', '<SortMenu by={sort} />'], ['+', '<Grid items={books} />']] },
      { kind: 'step', tool: 'build', arg: 'hot reload · :20032', meta: '1.2s' },
      { kind: 'done', title: 'Perubahan siap di estate lokal', list: ['1 file diubah', 'build ok'], qa: false }
    ];
  }
  chipLabels() { return { page: 'halaman', shot: 'screenshot', el: 'elemen', con: 'console · 2 error' }; }
  baseVals() {
    const s = this.state;
    const L = this.chipLabels();
    const items = s.items.map(it => ({
      isUser: it.kind === 'user', isText: it.kind === 'text', isStep: it.kind === 'step', isDiff: it.kind === 'diff', isPerm: it.kind === 'perm', isDone: it.kind === 'done',
      text: it.text || '', chips: it.chips || [], hasChips: !!(it.chips && it.chips.length),
      tool: it.tool || '', arg: it.arg || '', meta: it.meta || '',
      file: it.file || '', plus: '+' + (it.plus || 0), minus: '−' + (it.minus || 0),
      lines: (it.lines || []).map(([k, t]) => ({ t: (k === ' ' ? '  ' : k + ' ') + t, cls: k === '+' ? 'dl-add' : (k === '-' ? 'dl-del' : 'dl-ctx') })),
      cmd: it.cmd || '', why: it.why || '', pending: it.kind === 'perm' && !it.answered, answered: !!it.answered,
      answerText: it.answered === 'deny' ? '✕ ditolak' : (it.answered === 'all' ? '✓ diizinkan · selalu untuk proyek ini' : (it.answered === 'auto' ? '✓ diizinkan otomatis' : '✓ diizinkan sekali')),
      allow: () => this.answer(it.id, 'allow'), allowAll: () => this.answer(it.id, 'all'), deny: () => this.answer(it.id, 'deny'),
      title: it.title || '', list: it.list || [], isQa: !!it.qa
    }));
    const steps = s.items.filter(i => i.kind === 'step' || i.kind === 'diff').length;
    const send = () => {
      const t = (s.draft || '').trim();
      if (!t || s.busy) return;
      const chips = Object.keys(s.chips).filter(k => s.chips[k]).map(k => L[k]);
      this.setState({ draft: '' });
      this.run(this.genericScript(t, chips));
    };
    return {
      four: 4, one: 1, yes: true, no: false, s16: 16, s20: 20, s28: 28, s40: 40, s64: 64,
      busy: s.busy || !!s.wait, items,
      busyText: s.wait ? 'menunggu izinmu…' : 'agen bekerja · ' + steps + ' langkah',
      statusText: s.wait ? 'perlu izin' : (s.busy ? 'bekerja' : 'siap'),
      statusInk: s.wait ? '#b45d09' : (s.busy ? '#198653' : '#8d8493'),
      menu: s.menu, toggleMenu: () => this.setState({ menu: !s.menu }),
      isRight: s.side === 'right', isLeft: s.side === 'left',
      dockRight: () => this.setState({ side: 'right', menu: false }), dockLeft: () => this.setState({ side: 'left', menu: false }),
      bodyStyle: 'flex-direction: ' + (s.side === 'right' ? 'row' : 'row-reverse') + ';',
      panelStyle: s.side === 'right' ? 'border-left: 1px solid #ded9e1;' : 'border-right: 1px solid #ded9e1;',
      draft: s.draft, onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
      send, stop: () => this.setState({ q: [], wait: null, busy: false, items: s.items.concat([{ id: this.nid++, kind: 'text', text: '⏹ Dihentikan. Perubahan yang sudah dibuat tetap ada.' }]) }),
      ctxChips: Object.keys(L).map(k => ({ label: (s.chips[k] ? '✓ ' : '+ ') + L[k], on: !!s.chips[k], cls: 'cc' + (s.chips[k] ? ' on' : ''), toggle: () => this.setState({ chips: Object.assign({}, s.chips, { [k]: !s.chips[k] }) }) })),
      reloadTab: () => this.setState({ reloaded: true }), reloadLabel: s.reloaded ? '✓ tab dimuat ulang' : 'Reload tab',
      sendQa: () => this.setState({ qaSent: true }), qaSent: s.qaSent, qaLabel: s.qaSent ? '✓ terkirim ke pelapor' : 'Kirim ke QA #152 →',
      startQa: () => { if (s.busy || s.qaStarted) return; this.setState({ qaStarted: true }); this.run(this.qaScript()); },
      qaWaiting: !s.qaStarted
    };
  }

  extraState() { return { ob: 0, code: false, oc: 0, dir: 'rwid' }; }
  extraTick() {
    const s = this.state;
    if (s.code && s.ob === 0) { this.setState({ code: false, ob: 1 }); }
    if (s.ob === 2 && s.oc < 4) this.setState({ oc: s.oc + 1 });
    if (s.ob === 4) setTimeout(() => { if (this.state.ob === 4) this.setState({ ob: 5 }); }, 1600);
  }
  renderVals() {
    const s = this.state, b = this.baseVals();
    const defs = [
      ['Masuk', 'Satu akun untuk extension, eco CLI dan /project.', 'login', ''],
      ['Helper terpasang', 'Program kecil yang menjalankan opencode dan eco untukmu. Terdeteksi: v1.9 · macOS.', 'helper', 'Lanjut'],
      ['OpenCode', 'Agen coding lokal. Dipasang otomatis kalau belum ada.', 'oc', 'Lanjut'],
      ['Pilih proyek', 'Folder dengan ecompose.yml di mesinmu. Yang cocok dengan tab aktif ditandai.', 'dir', 'Hubungkan'],
      ['Hubungkan ke /project', 'eco pm link · QA masuk ke panel ini, ringkasan sesi tampil di /project.', 'link', '']
    ];
    const done = s.ob >= 5;
    const steps = defs.map(([title, desc, k, cta], i) => {
      const st = i < s.ob ? 'done' : (i === s.ob ? 'cur' : 'todo');
      return { title, cta, desc: k === 'link' && s.ob >= 4 ? (done ? '✓ token agen tersimpan di keychain · rwid-returns terhubung' : 'menautkan rwid-returns…') : desc,
        cur: st === 'cur', isLogin: k === 'login', isOc: k === 'oc', isDir: k === 'dir', showNext: !!cta && st === 'cur' && (k !== 'oc' || s.oc >= 4),
        mark: st === 'done' ? '✓' : String(i + 1), ink: st === 'todo' ? '#8d8493' : '#17141d',
        dot: 'display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font:600 12px Manrope,sans-serif;' + (st === 'done' ? 'background:#e0f2e8;color:#198653;' : (st === 'cur' ? 'border:1.5px solid #5b3fd6;color:#5b3fd6;background:#fff;' : 'border:1.5px solid #ded9e1;color:#8d8493;')),
        rowStyle: 'display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:14px 18px;border-top:1px solid #ece8ef;' + (st === 'cur' ? 'background:#fff;' : '') };
    });
    const oc = ['$ opencode --version', 'tidak ditemukan · memasang…', 'unduh opencode-darwin-arm64 … ok', '✓ opencode 0.15.8 · ~/.opencode/bin'];
    return Object.assign(b, {
      steps, stepLabel: done ? 'siap' : (s.ob + 1) + '/5',
      useCli: () => this.setState({ ob: 1 }), google: () => this.setState({ code: true }), showCode: s.code,
      ocLines: oc.slice(0, Math.max(1, s.oc)),
      dirs: [['rwid-returns', '~/estates/remoteworker', 'cocok dengan tab', 'rwid'], ['getecosphere', '~/estates/getecosphere', '', 'ge'], ['notes-demo', '~/code/notes-demo', 'serve', 'notes']].map(([name, path, tag, k]) => ({ name, path, tag, pick: () => this.setState({ dir: k }), style: 'display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid #ece8ef;background:' + (s.dir === k ? '#f4f1ff' : '#fff') + ';text-align:left;font:inherit;color:inherit;cursor:pointer;' })),
      next: () => this.setState({ ob: s.ob + 1 }), reset: () => this.setState({ ob: 0, oc: 0, code: false })
    });
  }

}
